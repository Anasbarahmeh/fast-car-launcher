name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Minimal App
        run: |
          mkdir -p app/src/main/java/com/fast/carlauncher
          mkdir -p app/src/main/res/values

          echo 'rootProject.name = "FastCarLauncher"' > settings.gradle
          echo "include ':app'" >> settings.gradle
          echo "plugins { id 'com.android.application' version '8.1.0' apply false; id 'org.jetbrains.kotlin.android' version '1.9.0' apply false }" > build.gradle
          echo "android.useAndroidX=true" > gradle.properties

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.fast.carlauncher'
              compileSdk 33
              defaultConfig {
                  applicationId "com.fast.carlauncher"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug { minifyEnabled false }
              }
          }
          dependencies {}
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="لانشر السريع" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fast/carlauncher/MainActivity.kt
          package com.fast.carlauncher
          import android.app.Activity
          import android.os.Bundle
          import android.widget.TextView
          import android.view.Gravity
          import android.widget.LinearLayout

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(0xFF0B1013.toInt())
                  }
                  val text = TextView(this).apply {
                      text = "لانشر السيارة السريع يعمل بكفاءة"
                      setTextColor(0xFF5EEAD4.toInt())
                      textSize = 24f
                      gravity = Gravity.CENTER
                  }
                  layout.addView(text)
                  setContentView(layout)
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: FastCarLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
